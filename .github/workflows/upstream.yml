name: Upstream check

# Packages get renamed and endpoints move. Once a week, check that every server in
# registry.json still points at something real. This needs the network and third parties
# being up, so it is deliberately not part of CI for pull requests.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    name: packages and endpoints still exist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check npm, PyPI, Docker Hub, GHCR and remote MCP endpoints
        run: npm run check:upstream
