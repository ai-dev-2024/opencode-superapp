name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs more than read access to the code.
permissions:
  contents: read

# A newer push to a pull request supersedes the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Third-party actions are pinned to a full commit SHA; the tag is in the comment.
# Dependabot (.github/dependabot.yml) keeps the pins current.

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Validate registry, templates and stacks
        run: npm run validate
      - name: registry.md is regenerated from registry.json
        run: npm run check:registry
      - name: Unit, CLI and installer tests
        run: npm test
      - name: Installer smoke test
        run: |
          node scripts/mcp-manager.mjs --help
          ./install.sh --list > /dev/null
          ./install.sh --superapp --config "$RUNNER_TEMP/opencode.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$RUNNER_TEMP/opencode.json"

  windows:
    name: windows (PowerShell 5.1 and 7)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Unit, CLI and installer tests
        run: npm test
      - name: install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "opencode-ps51.json"
          .\install.ps1 -List | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -List exited $LASTEXITCODE" }
          .\install.ps1 -Superapp -Config $cfg
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Superapp exited $LASTEXITCODE" }
          Get-Content -Raw $cfg | ConvertFrom-Json | Out-Null
          .\install.ps1 -Stack no-such-stack
          if ($LASTEXITCODE -ne 1) { throw "an unknown stack must exit 1, got $LASTEXITCODE" }
          exit 0
      - name: install.ps1 under PowerShell 7
        shell: pwsh
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "opencode-ps7.json"
          .\install.ps1 -List | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -List exited $LASTEXITCODE" }
          .\install.ps1 -Superapp -Config $cfg
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Superapp exited $LASTEXITCODE" }
          Get-Content -Raw $cfg | ConvertFrom-Json | Out-Null
          .\install.ps1 -Stack no-such-stack
          if ($LASTEXITCODE -ne 1) { throw "an unknown stack must exit 1, got $LASTEXITCODE" }
          exit 0

  lint:
    name: lint (shellcheck, PSScriptAnalyzer)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Both tools ship with the ubuntu runner image.
      - name: shellcheck install.sh
        run: |
          shellcheck --version
          shellcheck install.sh
      - name: PSScriptAnalyzer install.ps1
        shell: pwsh
        run: |
          $findings = Invoke-ScriptAnalyzer -Path ./install.ps1 -Severity Warning, Error
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .
